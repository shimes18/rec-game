<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Time</title>
    <style>
        
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

        body {
        font-family: 'Montserrat', sans-serif;
        }

        body{
            margin:0;
            padding:0;
        }
        #title{
            background-color: cyan;
            font-size: 30px;
            font-weight: bolder;
            text-align: center;
            height: 50px;
            align-self: center;
        }
        #game{
            background-color: #1e1b2e ;
            height: 80vh;
            display:flex;
            align-items: center;
            flex-direction: column;
        }
        #announce{
            color: whitesmoke;
            text-align: center;
            font-weight: bolder;
            font-size: 30px;
            margin-top: 30vh;
            justify-content: center;
        }
        #stats{
            color:whitesmoke;
            display:flex;
        }
    </style>
</head>
<body>
    <div id='title'>Reaction Time Check</div>
    <div id="game">
        <div id=stats>
            Your best score is:
            <div id="best"></div>
        </div>
        <div id="announce"></div>
        <div id='time'></div>
    </div>

    <script>
        const time=document.getElementById('time');
        const announce= document.getElementById('announce')
        const bg = document.getElementById('game')
        let state='prestart';
        let round=0;
        let timer=0;
        let starttime=0;
        let best = Number(localStorage.getItem('bestrt')) || 10000 ;

        document.getElementById('best').innerHTML= ' Your best time is: '+ best ==10000 ? 0 : Math.floor(best) + 'ms';
        let pretimer=0
        if (state=='prestart'){
            announce.innerHTML = 'Click to start';
        }

        bg.addEventListener('click',function (){
            if (state=='prestart'){
                state='start';
                time.innerHTML=' '
                announce.innerHTML = 'Wait for background to turn green';
                bg.style.backgroundColor= 'red';

                setTimeout(()=>{
                    bg.style.backgroundColor = 'lime';
                    announce.style.color = '#000000';
                    announce.innerHTML= 'Click!!!';
                    counting='start';
                    starttime= performance.now();
                    state='green'
                },Math.floor(Math.random()*3000)+2000);
            }
            

            
        });
    

        bg.addEventListener('click',function (){
            if (bg.style.backgroundColor=='lime'){
                timer= performance.now()-starttime;
                bg.style.backgroundColor='#1e1b2e';
                bg.style.color = 'whitesmoke';
                announce.style.color = 'whitesmoke';
                time.innerHTML=Math.floor(timer)+'ms';
                announce.innerHTML='Click to start again';
                state='prestart';
                if (best>timer){
                    localStorage.setItem('bestrt',String(timer));
                    best = timer;
                    document.getElementById('best').innerHTML= ' Your best time is: '+ best ==10000 ? 0 : Math.floor(best) + 'ms';
                }
            }



            


        });


    </script>
</body>
</html>
